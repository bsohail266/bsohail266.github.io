name: Automated BIW News Update

on:
 schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest remote changes
        run: git pull origin main --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser requests beautifulsoup4

      - name: Run news generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: python fetch_news.py

      - name: Commit and push news update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update: BIW news feeds [skip ci]"
          file_pattern: "bodyinwhite.in/news.json"
